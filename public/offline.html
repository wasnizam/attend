<!doctype html>
<!-- Shown by the iPhone and Android apps when dobry.app cannot be reached (Capacitor server.errorPath). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dobry: no internet</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #16123f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; }
  svg { width: 88px; height: 88px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 auto 6px; max-width: 320px; color: #c9c6e8; line-height: 1.45; font-size: 15px; }
  .ms { margin-top: 14px; color: #9e9ac8; font-size: 14px; }
  button { margin-top: 28px; min-width: 200px; height: 50px; border: 0; border-radius: 12px; background: #ffc83d; color: #16123f; font-size: 16px; font-weight: 700; }
  button:active { opacity: .85; }
  .wait { margin-top: 14px; font-size: 13px; color: #9e9ac8; min-height: 18px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs><clipPath id="h"><rect width="120" height="76"/></clipPath></defs>
    <rect width="120" height="120" rx="28" fill="#241e63"/>
    <circle cx="60" cy="72" r="32" fill="#ffc83d" clip-path="url(#h)"/>
    <path d="M45 60l10 10 20-22" fill="none" stroke="#16123f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="22" y="82" width="76" height="7" rx="3.5" fill="#fff"/>
  </svg>
  <h1>No internet connection</h1>
  <p>Dobry needs the internet to show your classes and take attendance. Check your Wi-Fi or mobile data.</p>
  <p class="ms">Tiada sambungan internet. Semak Wi-Fi atau data mudah alih anda.</p>
  <button id="retry" type="button">Try again · Cuba lagi</button>
  <div class="wait" id="wait"></div>
</main>
<script>
  var APP = 'https://dobry.app/app';
  function retry() {
    document.getElementById('wait').textContent = 'Connecting… · Menyambung…';
    window.location.replace(APP);
  }
  document.getElementById('retry').addEventListener('click', retry);
  // Back online by itself: carry on without a tap.
  window.addEventListener('online', retry);
</script>
</body>
</html>
